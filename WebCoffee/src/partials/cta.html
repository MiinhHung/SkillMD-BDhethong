<section class="cta" aria-labelledby="cta-title">
  <div class="cta-container">
    <div class="cta-left">
      <div class="cta-copy" data-anim>
        <h2 id="cta-title" class="cta-heading">{{ctaTitle}}</h2>
        <p class="cta-description">Quán bạn phục vụ món gì, đang dự định ra sao và cần hỗ trợ ở khâu nào. Mình bắt đầu từ một cuộc trò chuyện.</p>
      </div>
      <a href="{{ctaHref}}" class="btn btn--soft btn--wide">{{ctaLabel}}</a>
    </div>
    <img src="assets/img/cafe-counter.jpg" width="1400" height="788" loading="lazy" alt="Quầy pha chế với máy espresso và ly mang đi" class="cta-photo">
    <svg class="cta-wave" viewBox="0 0 600 260" width="600" height="260" aria-hidden="true" preserveAspectRatio="none"><path d="M14 250 96 98c26-50 98-47 121 4l10 22c20 44 82 46 104 2l2-3c22-45 87-41 104 6 19 55 99 48 108-9L564 4" fill="none" stroke="currentColor" stroke-width="32"/></svg>
  </div>
</section>
